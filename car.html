    <script>
      // --- 1. KONFIGURACJA ---
      var basePath = "generations/1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq/assets/app/";
      
      // Lista plików CSS dla tej konkretnej strony
      var cssFiles = ["car.css"]; 
  
      // --- 2. LOGIKA GŁÓWNA ---
      (function() {
          var mode = localStorage.getItem("app_mode"); // "light" lub null
  
          // A. ŁADOWANIE PLIKÓW CSS
          for (var i = 0; i < cssFiles.length; i++) {
              var fileName = cssFiles[i];
              if (mode === "light") {
                  fileName = fileName.replace(".css", "_light.css");
              }
              document.write('<link class="theme-link" rel="stylesheet" href="' + basePath + fileName + '">');
          }
  
          // B. AUTOMATYCZNA ZMIANA IKONEK (To naprawia Twój problem)
          if (mode === "light") {
              // KROK 1: Ukrywamy obrazki .html zanim się pojawią (żeby nie mignęły na ciemno)
              document.write('<style id="icon-fix">img[src$=".html"] { visibility: hidden; }</style>');
  
              // KROK 2: Czekamy aż strona się wczyta
              window.addEventListener('DOMContentLoaded', function() {
                  // Szukamy wszystkich obrazków kończących się na .html
                  var images = document.querySelectorAll('img[src$=".html"]');
  
                  images.forEach(function(img) {
                      var currentSrc = img.getAttribute("src");
                      
                      // Jeśli to nie jest jeszcze wersja light, zmieniamy
                      if (!currentSrc.includes("_light.html")) {
                          var newSrc = currentSrc.replace(".html", "_light.html");
                          
                          // ZABEZPIECZENIE: Jeśli wersja light nie istnieje, zostaw starą
                          img.onerror = function() {
                              this.onerror = null;
                              this.src = currentSrc;
                          };
                          
                          img.src = newSrc;
                      }
                  });
  
                  // KROK 3: Usuwamy blokadę widoczności - ikonki się pokazują
                  // Robimy minimalne opóźnienie (0ms), żeby przeglądarka zdążyła przetrawić zmianę src
                  setTimeout(function() {
                      var styleTag = document.getElementById("icon-fix");
                      if (styleTag) styleTag.remove();
                  }, 0);
              });
          }
      })();
  </script>

      function sendTo(pageName, shouldRedirect = false) {
        const navElements = document.querySelectorAll(".bottom_element_grid");
        navElements.forEach((element) => {
          element.classList.remove("active");
          const img = element.querySelector("img");
          const text = element.querySelector("p");
          if (img) {
            const pageId = element.dataset.page;
            img.src = iconPaths[pageId]?.inactive;
          }
          if (text) {
            text.classList.remove("active");
          }
        });
        const activeElement = document.querySelector(
          `a[onclick*="'${pageName}'"]`
        );
        if (activeElement) {
          activeElement.classList.add("active");
          const img = activeElement.querySelector("img");
          const text = activeElement.querySelector("p");
          if (img) {
            img.src = iconPaths[pageName]?.active;
          }
          if (text) {
            text.classList.add("active");
          }
        }
        // 2. KLUCZOWA ZMIANA: PRZEKIEROWANIE NA PLIK LOKALNY
  if (shouldRedirect) {

    let newUrl = `${pageName}.html`;
    
    console.log("Przekierowuję do lokalnego pliku:", newUrl);
    window.location.href = newUrl;
  }
}
