<head>
  <script>
    // --- 1. KONFIGURACJA ---
    var basePath = "generations/1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq/assets/app/";
    
    // Lista plików CSS dla tej konkretnej strony
    var cssFiles = ["main.css", "password.css", "qr.css"]; 

    // --- 2. LOGIKA GŁÓWNA ---
    (function() {
        var mode = localStorage.getItem("app_mode"); // "light" lub null

        // A. ŁADOWANIE PLIKÓW CSS
        for (var i = 0; i < cssFiles.length; i++) {
            var fileName = cssFiles[i];
            if (mode === "light") {
                fileName = fileName.replace(".css", "_light.css");
            }
            document.write('<link class="theme-link" rel="stylesheet" href="' + basePath + fileName + '">');
        }

        // B. AUTOMATYCZNA ZMIANA IKONEK (To naprawia Twój problem)
        if (mode === "light") {
            // KROK 1: Ukrywamy obrazki .html zanim się pojawią (żeby nie mignęły na ciemno)
            document.write('<style id="icon-fix">img[src$=".html"] { visibility: hidden; }</style>');

            // KROK 2: Czekamy aż strona się wczyta
            window.addEventListener('DOMContentLoaded', function() {
                // Szukamy wszystkich obrazków kończących się na .html
                var images = document.querySelectorAll('img[src$=".html"]');

                images.forEach(function(img) {
                    var currentSrc = img.getAttribute("src");
                    
                    // Jeśli to nie jest jeszcze wersja light, zmieniamy
                    if (!currentSrc.includes("_light.html")) {
                        var newSrc = currentSrc.replace(".html", "_light.html");
                        
                        // ZABEZPIECZENIE: Jeśli wersja light nie istnieje, zostaw starą
                        img.onerror = function() {
                            this.onerror = null;
                            this.src = currentSrc;
                        };
                        
                        img.src = newSrc;
                    }
                });

                // KROK 3: Usuwamy blokadę widoczności - ikonki się pokazują
                // Robimy minimalne opóźnienie (0ms), żeby przeglądarka zdążyła przetrawić zmianę src
                setTimeout(function() {
                    var styleTag = document.getElementById("icon-fix");
                    if (styleTag) styleTag.remove();
                }, 0);
            });
        }
    })();
</script>

  <script>
    // --- FUNKCJA 1: Czyszczenie błędu podczas wpisywania ---
    function resetError(inputElement, defaultPlaceholder) {
        // Przywraca domyślny kolor ramki (z pliku CSS) i oryginalny tekst
        inputElement.style.borderColor = ""; 
        inputElement.placeholder = defaultPlaceholder;
    }
    
    // --- FUNKCJA 2: Główna logika zmiany hasła ---
    function changePassword() {
        var oldPassInput = document.getElementById("oldPassword");
        var newPassInput = document.getElementById("newPassword");
        var confirmPassInput = document.getElementById("confirmPassword");
    
        var oldPassVal = oldPassInput.value.trim();
        var newPassVal = newPassInput.value.trim();
        var confirmPassVal = confirmPassInput.value.trim();
    
        var currentSavedPass = localStorage.getItem("app_password");
        var hasError = false; // Flaga, która sprawdzi, czy mamy jakiś błąd
    
        // 1. BŁĄD: Stare hasło jest nieprawidłowe
        if (oldPassVal !== currentSavedPass) {
            oldPassInput.value = ""; // Czyścimy pole
            oldPassInput.style.borderColor = "red"; // Czerwona ramka
            oldPassInput.placeholder = "Błędne obecne hasło!"; // Błąd w polu
            hasError = true;
        }
    
        // 2. BŁĄD: Nowe hasło jest puste
        if (newPassVal === "") {
            newPassInput.value = "";
            newPassInput.style.borderColor = "red";
            newPassInput.placeholder = "Wpisz nowe hasło!";
            hasError = true;
        }
    
        // 3. BŁĄD: Nowe hasła nie są identyczne (sprawdzamy tylko, jeśli nie jest puste)
        if (newPassVal !== "" && newPassVal !== confirmPassVal) {
            confirmPassInput.value = "";
            confirmPassInput.style.borderColor = "red";
            confirmPassInput.placeholder = "Hasła nie są identyczne!";
            hasError = true;
        }
    
        // Jeśli był jakikolwiek błąd, zatrzymujemy funkcję (nie zapisujemy)
        if (hasError) return;
    
        // --- SUKCES - Zapisujemy nowe hasło ---
        localStorage.setItem("app_password", newPassVal);
        
        // Czyścimy wszystkie pola po udanej zmianie
        oldPassInput.value = "";
        newPassInput.value = "";
        confirmPassInput.value = "";
    
        // Pokazujemy sukces w pierwszym okienku (zielona ramka)
        oldPassInput.style.borderColor = "#00C853"; 
        oldPassInput.placeholder = "Hasło zmienione pomyślnie!";
        
        // Po 3 sekundach przywracamy pierwsze okienko do normy
        setTimeout(function() {
            resetError(oldPassInput, "Obecne hasło");
        }, 3000);
    }
    </script>
