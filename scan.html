    <script>
      // --- 1. KONFIGURACJA ---
      var basePath = "generations/1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq/assets/app/";
      
      // Lista plików CSS dla tej konkretnej strony
      var cssFiles = ["main.css", "scan.css"]; 
  
      // --- 2. LOGIKA GŁÓWNA ---
      (function() {
          var mode = localStorage.getItem("app_mode"); // "light" lub null
  
          // A. ŁADOWANIE PLIKÓW CSS
          for (var i = 0; i < cssFiles.length; i++) {
              var fileName = cssFiles[i];
              if (mode === "light") {
                  fileName = fileName.replace(".css", "_light.css");
              }
              document.write('<link class="theme-link" rel="stylesheet" href="' + basePath + fileName + '">');
          }
  
          // B. AUTOMATYCZNA ZMIANA IKONEK (To naprawia Twój problem)
          if (mode === "light") {
              // KROK 1: Ukrywamy obrazki .html zanim się pojawią (żeby nie mignęły na ciemno)
              document.write('<style id="icon-fix">img[src$=".html"] { visibility: hidden; }</style>');
  
              // KROK 2: Czekamy aż strona się wczyta
              window.addEventListener('DOMContentLoaded', function() {
                  // Szukamy wszystkich obrazków kończących się na .html
                  var images = document.querySelectorAll('img[src$=".html"]');
  
                  images.forEach(function(img) {
                      var currentSrc = img.getAttribute("src");
                      
                      // Jeśli to nie jest jeszcze wersja light, zmieniamy
                      if (!currentSrc.includes("_light.html")) {
                          var newSrc = currentSrc.replace(".html", "_light.html");
                          
                          // ZABEZPIECZENIE: Jeśli wersja light nie istnieje, zostaw starą
                          img.onerror = function() {
                              this.onerror = null;
                              this.src = currentSrc;
                          };
                          
                          img.src = newSrc;
                      }
                  });
  
                  // KROK 3: Usuwamy blokadę widoczności - ikonki się pokazują
                  // Robimy minimalne opóźnienie (0ms), żeby przeglądarka zdążyła przetrawić zmianę src
                  setTimeout(function() {
                      var styleTag = document.getElementById("icon-fix");
                      if (styleTag) styleTag.remove();
                  }, 0);
              });
          }
      })();
  </script>

    <script>const folderId = "1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq";
      if (localStorage.getItem("top") === "card") {
        var back = document.querySelector(".back_text_fixed");
        back.innerHTML = "mDowód";
        back.onclick = () => {
          sendTo("card");
        };
      }

      function closeWarning() {
        document.querySelector(".warning-box").style.display = "none";
      }

      document
        .querySelector(".warning-close")
        .addEventListener("click", closeWarning);

      function showError() {
        const errorBox = document.querySelector(".error_box");
        errorBox.style.display = "block";
        errorBox.innerHTML = `
                <div class="loading"></div>
                <p class="error_title">Ładowanie...</p>
            `;

        document.querySelector(".error").classList.add("error_open");

        setTimeout(() => {
          errorBox.innerHTML = `
                    <div class="error_icon">
                        <svg width="70" height="70" viewBox="0 0 70 70">
                            <circle cx="35" cy="35" r="35" fill="#FF3B30"/>
                            <path d="M47 23L23 47M23 23L47 47" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <p class="error_title">Wystąpił błąd</p>
                    <p class="error_description">Nie możemy wyświetlić Twoich danych.<br>Spróbuj ponownie później.</p>
                    <button class="error_button retry" onclick="retryAction()">Spróbuj ponownie</button>
                    <button class="error_button back" onclick="sendTo('qr', '1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq')">Wróć</button>
                `;
        }, 2000);
      }

      function retryAction() {
        showError();
      }

      // 1. ZMODYFIKOWANA FUNKCJA SKANOWANIA (Freeze + akceptacja każdego kodu)
      function onScanSuccess(decodedText) {
        // Zamrażamy kamerę (stopklatka)
        try {
            html5QrCode.pause(true);
        } catch (e) {
            console.log("Pauza kamery nieobsługiwana, ignoruję:", e);
        }

        // Od razu przechodzimy do akceptacji (bez sprawdzania serwera)
        askForPermission(null, decodedText);
      }

      function onScanFailure(error) {
        return;
      }

      // ORYGINALNY MODUŁ KAMERY (Zostawiony dokładnie tak jak chciałeś)
      let html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: { exact: "environment" } },
        {
          fps: 10,
          videoConstraints: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            facingMode: "environment",
          },
        },
        onScanSuccess,
        onScanFailure
      );

      document.querySelector(".manual-input").addEventListener("click", () => {
        document.querySelector(".code-input-container").classList.add("active");
        document.querySelector(".code-input-field").focus();
      });

      function closeCodeInput() {
        document
          .querySelector(".code-input-container")
          .classList.remove("active");
        setTimeout(() => {
          document.querySelector(".code-input-field").value = "";
          document
            .querySelector(".code-input-field-container")
            .classList.remove("error");
        }, 300);
      }

      document
        .querySelector(".code-input-overlay")
        .addEventListener("click", closeCodeInput);

      // 2. ZMODYFIKOWANE RĘCZNE WPISYWANIE (Od razu akceptuje 6 cyfr)
      function submitCode() {
        const input = document.querySelector(".code-input-field");
        const value = input.value;

        if (value.length === 6) {
          closeCodeInput();
          // Przechodzimy od razu dalej
          askForPermission(value, null);
        }
      }

      // 3. ZMODYFIKOWANE PRZEJŚCIE DALEJ (Z okienkiem weryfikacji)
      function askForPermission(code, qrCode) {
        if (code) {
          localStorage.setItem("code", code);
        } else if (qrCode) {
          localStorage.setItem("qrCode", qrCode);
        }

        // Pokaż okienko "Weryfikacja..." na środku ekranu
        var modal = document.getElementById("verificationModal");
        if (modal) {
            modal.style.display = "flex";
        }

        // Odczekaj 2 sekundy i przenieś dalej do share
        setTimeout(() => {
            sendTo("share");
        }, 5000);
      }

      document
        .querySelector(".code-input-field")
        .addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);

          const submitButton = document.querySelector(".code-input-submit");
          submitButton.disabled = e.target.value.length !== 6;
        });
    </script>
