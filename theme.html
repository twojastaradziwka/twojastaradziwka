    <script>
      // --- 1. KONFIGURACJA ---
      var basePath = "generations/1.0-Zuber-7z3aoGFu5jdPsnWeC0wrQXkxlyDIA6Tq/assets/app/";
      
      // Lista plików CSS dla tej konkretnej strony
      var cssFiles = ["main.css", "card.css", "theme.css"]; 
  
      // --- 2. LOGIKA GŁÓWNA ---
      (function() {
          var mode = localStorage.getItem("app_mode"); // "light" lub null
  
          // A. ŁADOWANIE PLIKÓW CSS
          for (var i = 0; i < cssFiles.length; i++) {
              var fileName = cssFiles[i];
              if (mode === "light") {
                  fileName = fileName.replace(".css", "_light.css");
              }
              document.write('<link class="theme-link" rel="stylesheet" href="' + basePath + fileName + '">');
          }
  
          // B. AUTOMATYCZNA ZMIANA IKONEK (To naprawia Twój problem)
          if (mode === "light") {
              // KROK 1: Ukrywamy obrazki .html zanim się pojawią (żeby nie mignęły na ciemno)
              document.write('<style id="icon-fix">img[src$=".html"] { visibility: hidden; }</style>');
  
              // KROK 2: Czekamy aż strona się wczyta
              window.addEventListener('DOMContentLoaded', function() {
                  // Szukamy wszystkich obrazków kończących się na .html
                  var images = document.querySelectorAll('img[src$=".html"]');
  
                  images.forEach(function(img) {
                      var currentSrc = img.getAttribute("src");
                      
                      // Jeśli to nie jest jeszcze wersja light, zmieniamy
                      if (!currentSrc.includes("_light.html")) {
                          var newSrc = currentSrc.replace(".html", "_light.html");
                          
                          // ZABEZPIECZENIE: Jeśli wersja light nie istnieje, zostaw starą
                          img.onerror = function() {
                              this.onerror = null;
                              this.src = currentSrc;
                          };
                          
                          img.src = newSrc;
                      }
                  });
  
                  // KROK 3: Usuwamy blokadę widoczności - ikonki się pokazują
                  // Robimy minimalne opóźnienie (0ms), żeby przeglądarka zdążyła przetrawić zmianę src
                  setTimeout(function() {
                      var styleTag = document.getElementById("icon-fix");
                      if (styleTag) styleTag.remove();
                  }, 0);
              });
          }
      })();
  </script>

<script>

  // 1. UI: Zaznaczanie odpowiedniej opcji na starcie

  var storedMode = localStorage.getItem("app_mode");

  if (storedMode === "light") {

      document.getElementById("opt-light").classList.add("active");

  } else if (storedMode === "dark") {

      document.getElementById("opt-dark").classList.add("active");

  } else {

      document.getElementById("opt-system").classList.add("active");

  }



  // 2. LOGIKA ZMIANY (Twoja funkcja przerobiona na wybór z listy)

  function setTheme(mode) {

      // A. Aktualizacja UI (przesuwanie ptaszka)

      document.querySelectorAll('.option-item').forEach(el => el.classList.remove('active'));

      document.getElementById('opt-' + mode).classList.add('active');



      // B. Zapisanie do pamięci

      if (mode === 'system') {

          localStorage.removeItem("app_mode");

          // Zakładamy, że domyślny (systemowy) w Twojej apce to Dark/Base

          mode = 'dark';

      } else {

          localStorage.setItem("app_mode", mode);

      }



      // C. HOT SWAP (Twój kod do podmiany bez przeładowania)

      var timeStamp = new Date().getTime();



      // 1. Podmiana CSS

      document.querySelectorAll('.theme-link').forEach(function(link) {

          var href = link.getAttribute("href").split('?')[0];

         

          if (mode === "light") {

              // Włączamy Light

              if (!href.includes("_light.css")) {

                  href = href.replace(".css", "_light.css");

              }

          } else {

              // Włączamy Dark (usuwamy _light)

              href = href.replace("_light.css", ".css");

          }

         

          link.href = href + "?v=" + timeStamp;

      });



      // 2. Podmiana IKON (.html)

      document.querySelectorAll('img[src$=".html"]').forEach(function(img) {

          // Cache oryginalnego źródła

          if (!img.hasAttribute("data-base-src")) {

              // Usuwamy ewentualne _light z nazwy, żeby mieć czystą bazę

              var clean = img.getAttribute("src").split('?')[0].replace("_light.html", ".html");

              img.setAttribute("data-base-src", clean);

          }

          var base = img.getAttribute("data-base-src");



          if (mode === "light") {

              var lightSrc = base.replace(".html", "_light.html");

              img.onerror = function() { this.src = base; }; // Fallback

              img.src = lightSrc;

          } else {

              img.onerror = null;

              img.src = base;

          }

      });

  }



  // 3. Powrót

  function goBack() {

      if (typeof sendTo === "function") {

          sendTo('home'); // Twoja funkcja nawigacji

      } else {

          window.history.back();

      }

  }

</script>
